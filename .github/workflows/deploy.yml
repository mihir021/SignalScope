# ==============================================================================
# GitHub Actions CI/CD Pipeline for SignalScope
# Automatically tests, builds Docker image, and deploys to AWS EC2 via SSH
# ==============================================================================

name: CI/CD Pipeline - Build and Deploy to AWS EC2

# Trigger pipeline on push to the main branch or manual trigger via workflow_dispatch
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  # ----------------------------------------------------------------------------
  # Job 1: Build & Verify Docker Image
  # Tests that the application Docker image builds successfully before deploying
  # ----------------------------------------------------------------------------
  build:
    name: Build & Verify Docker Image
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout repository code using latest checkout action
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Set up Docker Buildx for modern caching and multi-platform build support
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Step 3: Build the Docker image locally on GitHub runner to validate correctness
      - name: Build Application Docker Image
        run: |
          docker build -t signalscope-app:latest .
          echo "Docker image built successfully."

  # ----------------------------------------------------------------------------
  # Job 2: Deploy to AWS EC2 Instance via SSH
  # Connects to EC2 using repository secrets and updates the running containers
  # NOTE: This job is SKIPPED if EC2 secrets (EC2_HOST, EC2_SSH_KEY) are not
  # configured in GitHub Settings > Secrets and variables > Actions.
  # To enable deployment, add these repository secrets:
  #   - EC2_HOST:    Public IP or hostname of your EC2 instance
  #   - EC2_SSH_KEY: Private SSH key (PEM format) for EC2 access
  #   - EC2_USER:    (Optional) SSH username, defaults to 'ubuntu'
  # ----------------------------------------------------------------------------
  deploy:
    name: Deploy to AWS EC2
    needs: build
    runs-on: ubuntu-latest
    # Only run on main branch AND only if EC2 deployment secrets are configured
    if: github.ref == 'refs/heads/main'

    steps:
      # Step 1: Preflight check — verify required deployment secrets exist
      # This prevents the SSH step from failing with cryptic connection errors
      # when secrets haven't been configured yet
      - name: Verify Deployment Secrets Are Configured
        id: check_secrets
        run: |
          if [ -z "${{ secrets.EC2_HOST }}" ] || [ -z "${{ secrets.EC2_SSH_KEY }}" ]; then
            echo "⚠️  EC2 deployment secrets are not configured."
            echo "   To enable auto-deployment, add EC2_HOST and EC2_SSH_KEY"
            echo "   in GitHub Settings > Secrets and variables > Actions."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "✅ Deployment secrets verified."
            echo "configured=true" >> "$GITHUB_OUTPUT"
            # Default SSH username to 'ubuntu' if EC2_USER is not explicitly set in repository secrets
            EC2_USER="${{ secrets.EC2_USER }}"
            echo "ec2_user=${EC2_USER:-ubuntu}" >> "$GITHUB_OUTPUT"
          fi

      # Step 2: Execute deployment commands remotely on EC2 via SSH
      # Only runs if the preflight check confirmed secrets are present
      - name: SSH into AWS EC2 and Redeploy
        if: steps.check_secrets.outputs.configured == 'true'
        uses: appleboy/ssh-action@v1.2.1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ steps.check_secrets.outputs.ec2_user }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          # Timeout after 5 minutes to prevent hung deployments
          timeout: 300s
          script: |
            # Exit immediately if a command exits with a non-zero status
            set -e

            # Clone repository if it does not already exist on EC2
            if [ ! -d "$HOME/SignalScope" ]; then
              echo "=== Initializing repository on EC2 ==="
              git clone git@github.com:mihir021/SignalScope.git "$HOME/SignalScope"
            fi

            # Navigate to the SignalScope workspace directory on EC2
            cd "$HOME/SignalScope"

            echo "=== Pulling latest changes from main branch ==="
            git fetch origin main
            git reset --hard origin/main

            echo "=== Tearing down existing containers ==="
            docker compose down

            echo "=== Rebuilding and starting updated containers ==="
            docker compose up -d --build

            echo "=== Cleaning up unused dangling Docker images ==="
            docker image prune -f

            echo "=== SignalScope deployment completed successfully! ==="

      # Step 3: Log skip message when deployment is not configured
      - name: Skip Deployment (Secrets Not Configured)
        if: steps.check_secrets.outputs.configured == 'false'
        run: |
          echo "============================================================"
          echo "⏭️  DEPLOYMENT SKIPPED — EC2 secrets not configured."
          echo ""
          echo "The Docker build passed successfully ✅"
          echo "To enable automatic EC2 deployment, add these GitHub secrets:"
          echo "  • EC2_HOST    → Public IP or hostname of your EC2 instance"
          echo "  • EC2_SSH_KEY → Private SSH key (PEM format) for SSH access"
          echo "  • EC2_USER    → (Optional) SSH username, defaults to 'ubuntu'"
          echo ""
          echo "Go to: Settings > Secrets and variables > Actions > New secret"
          echo "============================================================"
