# ==============================================================================
# Prometheus Configuration for SignalScope
# Scrapes the FastAPI application metrics exported via prometheus-fastapi-instrumentator
# ==============================================================================

# Global configuration applied to all scrape targets unless overridden
global:
  scrape_interval: 15s      # Scrape targets every 15 seconds
  scrape_timeout: 10s       # Per-scrape timeout
  evaluation_interval: 15s  # Rule evaluation interval

# List of scrape targets
scrape_configs:
  # Job 1: SignalScope FastAPI Application Scraper
  # Queries the app service running in docker-compose on port 8000 at path /metrics
  - job_name: 'app'
    metrics_path: '/metrics'
    scheme: 'http'
    static_configs:
      - targets: ['app:8000']
        labels:
          application: 'signalscope-backend'
          environment: 'production'
          service: 'fastapi'

  # Job 2: Prometheus Self-Monitoring (Optional but standard practice)
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          service: 'prometheus'
